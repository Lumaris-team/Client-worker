# Principal informations
name = "dashboard"
main = "src/index.js"
compatibility_date = "2026-05-22"
workers_dev = true
compatibility_flags = ["nodejs_compat"]

# Environement variables
[vars]
MODE = "production" # -> "production" if enabled, or any other name if disabled
SITE = "enabled" # -> "enabled" if enabled, or any other name if disabled
JWT_SECRET = "generate-a-secure-random-key"
JWT = "generate-a-secure-random-key"

# Production environment
[env.production]
vars = { JWT_SECRET = "generate-a-secure-random-key", JWT = "generate-a-secure-random-key" }

# Static site
[assets]
directory = "./src/frontend"
binding = "ASSETS"

# Worker AI
[ai]
name = "AI"
binding = "AI"

# Deleted conversations (KV namespace)
[[kv_namespaces]]
binding = "deleted_chats"
id = "ece9f46bc7ca471eac5be9d214de322e"

# Customization settings (D1 database)
[[d1_databases]]
binding = "customization"
database_name = "customization"
database_id = "3847c9fd-58c0-42bf-922c-1a517cec2a66"

# Workflows
[[workflows]]
name = "check_grades"
binding = "CHECK_GRADES"
class_name = "CheckGradesWorkflow"

# Cron triggers
[triggers]
crons = ["0 */4 * * *"]  # Vérifier les notes toutes les 4 heures

# Observability
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1
